[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gesicht"
version = "0.1.0"
description = "A scope-safe recon and vulnerability-scanning CLI orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "457r0" }]
keywords = ["security", "scanner", "vulnerability-scanner", "recon", "hackerone", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    # pin to the click-based 0.12 line; 0.13+ vendors its own click fork under
    # typer._click, which we don't want to import from.
    "typer>=0.12,<0.13",
    # typer 0.12.x is not compatible with click >= 8.2
    "click>=8.1,<8.2",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "cvss>=3.0",
    "publicsuffix2>=2.2021",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-socket>=0.7",
    "hypothesis>=6.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/457r0/gesicht"
Issues = "https://github.com/457r0/gesicht/issues"

[project.scripts]
gesicht = "gesicht.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gesicht"]

[tool.hatch.build.targets.wheel.force-include]
"src/gesicht/data" = "gesicht/data"
"src/gesicht/report/templates" = "gesicht/report/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
]
